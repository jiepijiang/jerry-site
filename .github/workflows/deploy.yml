name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每天重新生成一次「最近在做什么」的数据。
  # UTC 21:17 = 北京时间 05:17，避开整点（GitHub 的定时任务在整点高峰常被延迟）。
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送不打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 在构建期把「最近在做什么」的数据拉下来。放在这里而不是浏览器里，
      # 是因为未登录的 api.github.com 限流按**出口 IP** 算（60 次/小时），
      # 走代理时出口 IP 共享，访客很容易吃 403 → 首页那一块空白。
      # CI 里带 token 是 5000 次/小时，不会限流。
      - name: 拉取 GitHub 最近动态
        run: npm run recent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 重新生成首屏的贪吃蛇贡献图。同样只能放构建期 —— 它读的是 GitHub 的
      # 贡献日历，浏览器里没有可用的公开接口（也没有 CORS）。
      #
      # **失败不影响发布**：仓库里那份 snake.svg 是兜底，一张图不该把整站部署搞挂。
      # 所以先写到 .snake/ 暂存，确认有内容了再覆盖 —— 直接往目标路径写的话，
      # 中途失败会留下一个半截文件。
      - name: 生成贡献贪吃蛇
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: jiepijiang
          # color_snake 用站点主色，默认的 purple(#800080) 压在浅灰格子上看不清蛇。
          # %23 就是 #，写 # 在 YAML 里容易被当成注释。
          outputs: .snake/snake.svg?color_snake=%23bd34fe

      - name: 替换贪吃蛇（没生成出来就沿用仓库里那份）
        run: |
          if [ -s .snake/snake.svg ]; then
            cp .snake/snake.svg public/static/img/snake.svg
            echo "✓ 已更新 snake.svg（$(wc -c < public/static/img/snake.svg) 字节）"
          else
            echo "· 本次没生成出来，沿用仓库里的 snake.svg"
          fi

      - name: 构建
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
