name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每天重新生成一次「最近在做什么」的数据。
  # UTC 21:17 = 北京时间 05:17，避开整点（GitHub 的定时任务在整点高峰常被延迟）。
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送不打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 在构建期把「最近在做什么」的数据拉下来。放在这里而不是浏览器里，
      # 是因为未登录的 api.github.com 限流按**出口 IP** 算（60 次/小时），
      # 走代理时出口 IP 共享，访客很容易吃 403 → 首页那一块空白。
      # CI 里带 token 是 5000 次/小时，不会限流。
      - name: 拉取 GitHub 最近动态
        run: npm run recent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 重新生成首屏的贪吃蛇贡献图。同样只能放构建期 —— 它读的是 GitHub 的
      # 贡献日历，浏览器里没有可用的公开接口（也没有 CORS）。
      #
      # **失败不影响发布**：仓库里那份 snake.svg 是兜底，一张图不该把整站部署搞挂。
      # 所以先写到 .snake/ 暂存，确认有内容了再覆盖 —— 直接往目标路径写的话，
      # 中途失败会留下一个半截文件。
      - name: 生成贡献贪吃蛇
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: jiepijiang
          # color_snake 用站点主色，默认的 purple(#800080) 压在浅灰格子上看不清蛇。
          # %23 就是 #，写 # 在 YAML 里容易被当成注释。
          outputs: .snake/snake.svg?color_snake=%23bd34fe

      - name: 替换贪吃蛇（没生成出来就沿用仓库里那份）
        run: |
          if [ -s .snake/snake.svg ]; then
            cp .snake/snake.svg public/static/img/snake.svg
            echo "✓ 已更新 snake.svg（$(wc -c < public/static/img/snake.svg) 字节）"
          else
            echo "· 本次没生成出来，沿用仓库里的 snake.svg"
          fi

      - name: 构建
        env:
          # 留言板后端（Supabase）。用 vars 不是 secrets —— anon key 本来就是
          # 公开的、会被打进 bundle；service_role 绝不能进这里。
          # 没配也不报错：site.js 里 endpoint 为空 → 留言板退回本地假成功（控制台留痕）。
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # 构建期核对：Vite 的 import.meta.env.VITE_* 是**静态替换**，
      # 变量没注入不会报错，只会静默地把 endpoint 变成空串 ——
      # 线上表现是「留言板点了没反应（其实走了假成功）」，本地复现不出来。
      # 所以这里必须自己检查一遍产物。
      #
      # 分两层，不能互相替代：
      #   ① 变量**本身**对不对 —— 值有没有空白、role 是不是 anon、ref 对不对得上
      #   ② 产物里到底有没有 —— 变量对了也可能因为变量名拼错而根本没生效
      - name: 核对 Supabase 配置是否已注入
        run: |
          # ① 这一步以前是 `echo "…（anon key 长度 ${#KEY}）"`。
          #    那只是**打印**，不是**判断**：2026-10-01 变量里粘进了尾随 CRLF
          #    （208 → 210 字符），这行老老实实把 210 打出来，然后放行 ——
          #    于是带换行的 key 被烧进了线上 bundle。现在换成真脚本，
          #    并且顺带加上「role 必须是 anon」这条（防 service_role 被贴进来）。
          npm run check:env

          # ② 产物核对
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "· 未配置 Supabase，跳过产物核对（留言板走本地假成功）"
            exit 0
          fi

          if grep -rqF "$VITE_SUPABASE_URL" dist/assets/; then
            echo "✅ 产物里已包含 Supabase URL"
          else
            echo "::error title=注入失败::环境变量给了，但 dist/assets/ 里找不到它 —— 检查变量名是不是拼错了（必须是 VITE_ 前缀）。"
            exit 1
          fi

          if grep -rqF "rpc/post_guestbook_message" dist/assets/; then
            echo "✅ 产物里已包含留言板 RPC 路径"
          else
            echo "::error title=留言板接线丢失::产物里找不到 rpc/post_guestbook_message，site.js 的 guestbook 配置可能被改坏了。"
            exit 1
          fi

          # service_role 绝不能出现在前端产物里 —— 它会绕过 RLS，被公开给每个访客。
          # ① 已经从 JWT 的 role 字段判过一次，这里对**产物本身**再兜一次：
          # 防的是「有人把 key 硬编码进源码」这条不同的路径。
          if grep -rqF "service_role" dist/assets/; then
            echo "::error title=产物里出现了 service_role::它会绕过 RLS 并被公开给每个访客，立刻去 Supabase 后台轮换这个 key。"
            exit 1
          fi
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
